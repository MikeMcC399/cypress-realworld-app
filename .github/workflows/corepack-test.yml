name: Corepack Test
# Test compatibility with corepack enabled
# See https://nodejs.org/dist/latest/docs/api/corepack.html

on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_dispatch:

jobs:
  install-and-test:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install corepack latest
        run: npm install -g corepack@latest
      - name: Enable Corepack
        # currently globally installing corepack also enables it
        # the enable command is only for the case that the default is changed
        run: corepack enable yarn
      - name: Show corepack version
        run: corepack --version
      - name: Show yarn version
        run: yarn --version
      - name: Cypress build and test
        uses: cypress-io/github-action@v6
        with:
          build: yarn build
          start: yarn start:ci
          wait-on: "http://localhost:3001"
          wait-on-timeout: 120
          spec: cypress/tests/ui/*
